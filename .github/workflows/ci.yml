name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: appointments_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: "npm"

      - name: Install dependencies
        run: |
          cd msys-cursor-workshop/api
          npm ci

      - name: Run migrations & seeds
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/appointments_db
        run: |
          cd msys-cursor-workshop/api
          npx knex migrate:latest --env development
          npx knex seed:run --env development

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/appointments_db
          JWT_SECRET: github-actions-secret
        run: |
          cd msys-cursor-workshop/api
          npm test -- --runInBand
